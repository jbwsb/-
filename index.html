<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hush</title>
<style>
:root{--bg:#e3ebee;--ink:#16242d;--mine:#16324a;--line:#c4d1d8;--flag:#f2b705;--mute:#5d7280}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1{font:800 28px/1 "Arial Narrow","Trebuchet MS",sans-serif;margin:0}
.pad{padding:20px;display:flex;flex-direction:column;gap:10px}
.sub{color:var(--mute);font-size:13px;margin:0}.err{color:#b3261e;font-size:14px;min-height:20px}
button,input{font:inherit}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--flag);outline-offset:1px}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--mine);color:#fff;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--mine);border:1.5px solid var(--mine);padding:6px 10px;font-size:13px}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:transparent;color:var(--mine);border:1.5px solid var(--line);font-size:14px;padding:10px 8px}
.seg button.on{background:var(--mine);color:#fff;border-color:var(--mine)}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:#f3f7f8}
.top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#aab8c0;flex:none}.dot.on{background:#2e9e5b}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:9px 13px;border-radius:16px;background:#fff;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{background:var(--mine);color:#fff;align-self:flex-end}
.m b{display:block;font-size:12px;opacity:.7}
.empty{color:var(--mute);margin:auto;text-align:center;padding:20px}
.send{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#f3f7f8}
</style>
</head>
<body>
<div id="app"></div>
<script>
const NTFY = 'https://ntfy.sh/';
const $ = document.getElementById('app');
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

/* S = { name, seat, phrase, inbox, out }
   Two fixed seats (1 and 2). Each seat has its own private inbox topic.
   You listen on your inbox and send to the other seat's inbox,
   so your own messages never come back as notifications. */
let S = load('hush2-s', null);
const seen = new Set(load('hush2-seen', []));
let since = load('hush2-since', 'all');
const shown = new Map();
let es = null;

async function topicOf(phrase, seat) {
  const raw = 'hush|' + phrase.trim().toLowerCase() + '|inbox' + seat;
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  return 'hush-' + [...new Uint8Array(b)].slice(0, 16).map(x => x.toString(16).padStart(2, '0')).join('');
}

/* invite link: site#<phrase>  -> opens the join screen with the phrase filled in and seat 2 chosen */
let inviteHash = '';
if (location.hash.length > 1) {
  try { inviteHash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
}

function viewJoin() {
  let seat = inviteHash ? 2 : 1;
  $.innerHTML = `<div class="pad"><h1>Hush</h1>
    <p class="sub">Private chat for two. Pick any name you like.</p>
    <div class="seg" id="sg"><button id="s1">I'm starting this chat</button><button id="s2">My friend invited me</button></div>
    <input id="nm" maxlength="20" placeholder="Your name" autocomplete="off" autocapitalize="off">
    <input id="ph" placeholder="Secret phrase (8+ characters)" autocomplete="off" autocapitalize="off">
    <div class="err" id="er"></div><button id="go">Enter</button></div>`;
  const ph = document.getElementById('ph');
  const paint = () => {
    document.getElementById('s1').className = seat === 1 ? 'on' : '';
    document.getElementById('s2').className = seat === 2 ? 'on' : '';
  };
  document.getElementById('s1').onclick = () => { seat = 1; paint(); };
  document.getElementById('s2').onclick = () => { seat = 2; paint(); };
  if (inviteHash) ph.value = inviteHash;
  paint();
  document.getElementById('go').onclick = async () => {
    const name = document.getElementById('nm').value.trim();
    const phrase = ph.value;
    const er = document.getElementById('er');
    if (name.length < 2) { er.textContent = 'Name needs 2+ characters.'; return; }
    if (phrase.trim().length < 8) { er.textContent = 'Use a longer secret phrase so strangers cannot guess it.'; return; }
    const other = seat === 1 ? 2 : 1;
    S = { name, seat, phrase, inbox: await topicOf(phrase, seat), out: await topicOf(phrase, other) };
    save('hush2-s', S);
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    viewChat();
  };
}

function viewChat() {
  $.innerHTML = `<div class="top"><b id="me"></b><i class="dot" id="st"></i>
      <button class="g" id="al">Alerts</button><button class="g" id="iv">Invite</button><button class="g" id="lo">Leave</button></div>
    <div class="msgs" id="ms"></div>
    <div class="send"><input id="tx" placeholder="Message" autocomplete="off"><button id="sd">Send</button></div>`;
  document.getElementById('me').textContent = S.name;
  document.getElementById('sd').onclick = send;
  document.getElementById('tx').onkeydown = e => { if (e.key === 'Enter') send(); };
  document.getElementById('lo').onclick = () => {
    if (!confirm('Leave this chat on this device?')) return;
    if (es) es.close();
    ['hush2-s', 'hush2-seen', 'hush2-since'].forEach(k => localStorage.removeItem(k));
    S = null; inviteHash = ''; viewJoin();
  };
  document.getElementById('al').onclick = async () => {
    if ('Notification' in window && Notification.permission !== 'granted') await Notification.requestPermission();
    if (confirm('To get alerts when this page is closed, ntfy needs to be subscribed to your private inbox.\n\nOpen the ntfy page now and tap Subscribe?')) {
      window.open(NTFY + S.inbox, '_blank');
    }
  };
  document.getElementById('iv').onclick = async () => {
    const link = location.href.split('#')[0] + '#' + encodeURIComponent(S.phrase);
    try { await navigator.clipboard.writeText(link); alert('Invite link copied. Send it to your friend.'); }
    catch (e) { prompt('Copy this invite link and send it to your friend:', link); }
  };
  connect(); render();
}

function connect() {
  if (es) es.close();
  es = new EventSource(NTFY + S.inbox + '/sse?since=' + since);
  es.onopen = () => setDot(true);
  es.onerror = () => setDot(false);          // EventSource retries by itself
  es.onmessage = e => {
    let d; try { d = JSON.parse(e.data); } catch (x) { return; }
    if (d.event !== 'message' || seen.has(d.id) || shown.has(d.id)) return;
    if (typeof d.message !== 'string' || !d.message) return;
    const n = String(d.title || '?').slice(0, 20), t = d.message.slice(0, 2000);
    shown.set(d.id, { me: false, n, t, ts: d.time * 1000, time: d.time });
    if (document.hidden) alertMe(n);
    render(); markSeen();
  };
}
function setDot(on) { const s = document.getElementById('st'); if (s) s.className = 'dot' + (on ? ' on' : ''); }

function render() {
  const ms = document.getElementById('ms'); if (!ms) return;
  ms.innerHTML = '';
  const list = [...shown.values()].sort((a, b) => a.ts - b.ts);
  if (!list.length) ms.innerHTML = '<div class="empty">No new messages. Anything you have already read is gone.</div>';
  list.forEach(m => {
    const d = document.createElement('div'); d.className = 'm' + (m.me ? ' me' : '');
    if (!m.me) { const b = document.createElement('b'); b.textContent = m.n; d.appendChild(b); }
    d.appendChild(document.createTextNode(m.t)); ms.appendChild(d);
  });
  ms.scrollTop = ms.scrollHeight;
}

/* once a message has been on a visible screen it counts as read on this device and will not come back */
function markSeen() {
  if (document.hidden || !S) return;
  let newest = 0;
  shown.forEach((m, id) => { if (!m.me) { seen.add(id); newest = Math.max(newest, m.time); } });
  if (newest) { since = newest; save('hush2-since', since); }
  save('hush2-seen', [...seen].slice(-400));
  document.title = 'Hush';
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { markSeen(); if (S && (!es || es.readyState === 2)) connect(); } });

function alertMe(name) {
  document.title = '(1) New message';
  if (navigator.vibrate) navigator.vibrate(200);
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Hush', { body: 'New message from ' + (name || 'friend') }); } catch (e) {}
  }
}

async function send() {
  const tx = document.getElementById('tx'), text = tx.value.trim(); if (!text) return;
  tx.value = '';
  try {
    // goes to the OTHER person's inbox: their notification reads  <your name> / <text>
    const msg = { topic: S.out, title: S.name, message: text };
    if (location.protocol.startsWith('http')) msg.click = location.href.split('#')[0].split('?')[0];
    const r = await fetch(NTFY, { method: 'POST', body: JSON.stringify(msg) });
    if (!r.ok) throw 0;
    shown.set('L' + Date.now() + Math.random(), { me: true, n: S.name, t: text, ts: Date.now(), time: 0 });
    render();
  } catch (e) { tx.value = text; alert('Could not send. Check your connection and try again.'); }
}

S ? viewChat() : viewJoin();
</script>
</body>
</html>
