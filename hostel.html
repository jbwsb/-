<script>
'use strict';
/* New Ekalabya Hostel - pixel diorama. Rendering style follows pixel-plays engine.js
   (depth buffer, hue-shifted ramps, Bayer dither, depth-buffer edges, stepped wind),
   but with a free camera: tilt, zoom, 360 orbit around the character. */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);
const rgb=(r,g,b)=>(255<<24|Math.min(255,b|0)<<16|Math.min(255,g|0)<<8|Math.min(255,r|0))>>>0;
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function noise(x,y){const ix=Math.floor(x),iy=Math.floor(y),fx=ease(x-ix),fy=ease(y-iy);return lerp(lerp(hash(ix,iy),hash(ix+1,iy),fx),lerp(hash(ix,iy+1),hash(ix+1,iy+1),fx),fy);}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bayerAt=(x,y)=>BAYER[(y&3)*4+(x&3)];
const COOL=[46,38,84],WARM=[255,232,180];
const ramps=new WeakMap();
function rampOf(c){let r=ramps.get(c);if(r)return r;const mix=(m,t,k)=>rgb(lerp(c[0]*m,t[0],k),lerp(c[1]*m,t[1],k),lerp(c[2]*m,t[2],k));r=[mix(.4,COOL,.34),mix(.62,COOL,.18),mix(.84,COOL,.05),mix(1,WARM,0),mix(1.1,WARM,.22)];ramps.set(c,r);return r;}
const tintC=(c,r,g,b)=>rgb((c&255)*r,(c>>8&255)*g,(c>>16&255)*b);
const tc=(pal,tone,i,j)=>rampOf(pal)[clamp(Math.floor(tone+(bayerAt(i,j)-.5)*.7),0,4)];

/* ---------- display ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,OX=0,OY=0,img,pix,zb,pm,gdRow;
function resize(){
  const dpr=window.devicePixelRatio||1;
  let art=Math.max(2,Math.round(1.8*dpr));
  let w=Math.floor(innerWidth*dpr/art),h=Math.floor(innerHeight*dpr/art);
  while(w*h>170000){art++;w=Math.floor(innerWidth*dpr/art);h=Math.floor(innerHeight*dpr/art);}
  W=Math.max(100,w);H=Math.max(100,h);
  cv.width=W;cv.height=H;img=ctx.createImageData(W,H);pix=new Uint32Array(img.data.buffer);
  zb=new Float32Array(W*H);pm=new Uint8Array(W*H);gdRow=new Float32Array(H);OX=W/2;OY=H*.5;
}

/* ---------- camera ---------- */
const DEF={yaw:22*Math.PI/180,el:30*Math.PI/180,S:8};
const cam={yaw:DEF.yaw,el:DEF.el,S:DEF.S};
let cosY=1,sinY=0,ce=1,se=0,S=8,OZ=1.3,PX=0,PY=0;
function proj(x,y,z){const X=x-PX,Y=y-PY,rx=X*cosY+Y*sinY,ry=-X*sinY+Y*cosY;return{sx:OX+rx*S,sy:OY+(ry*se-(z-OZ)*ce)*S,d:ry*ce+z*se};}

/* ---------- palettes ---------- */
const PINK=[226,166,148],CREAM=[238,206,176],OCHRE=[222,170,64],YELL=[228,204,128],CONCB=[190,186,172],PLINTH=[176,156,146];
const GLASS=[40,36,64],SHUTR=[162,74,48],WOOD=[96,60,42],GRILLE=[176,98,44],DARK=[30,26,34],ROOFP=[142,134,124],MOSS=[96,116,70];
const CONC=[170,166,154],BLUE=[30,72,166],WHITE=[246,244,236],MAROON=[150,58,50],WALLC=[214,206,184],CAP=[110,100,94];
const PUMPC=[62,102,134],PIPEC=[100,116,132],CABLE=[44,42,48],BRICK=[176,90,68];
const G_EARTH=[176,150,104],G_DRY=[156,154,86],G_GRASS=[100,138,66],G_DEEP=[66,108,58];
const BARK=[92,74,60],LEAF_DEEP=[58,84,62],LEAF_MID=[100,126,78],LEAF_SILVER=[146,162,112];
const SHRUB1=[44,104,100],SHRUB2=[72,132,92];
const SHIRT=[214,84,66],STRIPE=[244,226,196],LEGS=[52,60,98],SKIN=[226,170,132],HAIR=[40,30,32],SHOE=[226,222,212];

/* ---------- scene storage ---------- */
const TF=6;                       // texels per world unit on walls
const SHADE={T:3.7,W:3.1,S:2.55,E:1.35,N:1.75};
const SHX=.7,SHY=-.25;            // shadow offset per unit of height (light from the west)
const faces=[],colliders=[],platforms=[],casters=[],treeCols=[],trees=[],tufts=[],shrubs=[];
const hidden={1:false,2:false};
let biasN=0;
function mkFace(o){
  const tex=new Uint32Array(o.tw*o.th);
  for(let j=0;j<o.th;j++)for(let i=0;i<o.tw;i++)tex[j*o.tw+i]=o.fn(i,j)>>>0;
  o.tex=tex;o.bias=(++biasN)*.002;faces.push(o);
}
const FONT={
 N:['10001','11001','10101','10101','10011','10001','10001'],E:['11111','10000','10000','11110','10000','10000','11111'],
 W:['10001','10001','10001','10101','10101','11011','10001'],K:['10001','10010','10100','11000','10100','10010','10001'],
 A:['01110','10001','10001','11111','10001','10001','10001'],L:['10000','10000','10000','10000','10000','10000','11111'],
 B:['11110','10001','10001','11110','10001','10001','11110'],Y:['10001','10001','01010','00100','00100','00100','00100'],
 H:['10001','10001','10001','11111','10001','10001','10001'],O:['01110','10001','10001','10001','10001','10001','01110'],
 S:['01111','10000','10000','01110','00001','00001','11110'],T:['11111','00100','00100','00100','00100','00100','00100']};
function signFn(side,b,tf){
  if(side!=='S')return null;
  const tw=Math.round((b.x1-b.x0)*tf),th=Math.round((b.z1-b.z0)*tf),K=4,lines=['NEW EKALABYA','HOSTEL'];
  return(i,j)=>{
    if(i<3||j<3||i>=tw-3||j>=th-3)return tc(WHITE,3.4,i,j);
    for(let L=0;L<2;L++){
      const txt=lines[L],w=txt.length*6*K-K,x0=(tw-w)>>1,y0=Math.round((th-17*K)/2)+L*10*K,ii=i-x0,jj=j-y0;
      if(ii>=0&&ii<w&&jj>=0&&jj<7*K){
        const ci=Math.floor(ii/(6*K)),gx=Math.floor((ii%(6*K))/K),gy=Math.floor(jj/K);
        if(gx<5){const g=FONT[txt[ci]];if(g&&g[gy][gx]==='1')return tc(WHITE,3.3,i,j);}
      }
    }
    return tc(BLUE,3.0,i,j);
  };
}
function wallFn(side,b,s){
  const horiz=side==='S'||side==='N',a0=horiz?b.x0:b.y0,a1=horiz?b.x1:b.y1,h=b.z1;
  const base=SHADE[side],seed=(b.x0*1.7+b.y0*2.3)%37;
  const doors=(s.doors||[]).filter(d=>d.side===side),zones=(s.zones||[]).filter(z=>z.side===side);
  const wins=[];
  for(let c=a0+2.4;c<=a1-1.8;c+=4.6){if(doors.some(d=>Math.abs(d.pos-c)<(d.w||1.9)/2+1.4))continue;wins.push(c);}
  const fz=[2.5,8.4],nf=s.floors;
  return(i,j)=>{
    const u=a0+(i+.5)/TF,z=h-(j+.5)/TF,g=noise(u*.8+seed,z*.5);
    let pal=s.pal,t=base+(g-.5)*.8;
    const zone=zones.find(q=>u>=q.a0&&u<=q.a1);if(zone)pal=zone.pal;
    for(const d of doors){
      const w=d.w||1.9,dh=d.h||3.8,z0=d.z0||0;
      if(Math.abs(u-d.pos)<=w/2&&z>=z0&&z<=z0+dh){
        if(Math.abs(u-d.pos)>w/2-.2||z>z0+dh-.2)return tc(CREAM,base,i,j);
        if(d.main){if(i%3===0||Math.abs(z-(z0+dh*.55))<.08)return tc(GRILLE,base,i,j);return tc(DARK,base-.6,i,j);}
        return tc(WOOD,base-.4-(i%4===0?.5:0),i,j);
      }
    }
    if(z>h-.8)return tc(CREAM,base+.2,i,j);
    if(z<.9){const m=noise(u*2.5+seed,z*3);return tc(PLINTH,base-.3+(g-.5)*.8-m*.9,i,j);}
    for(const c of wins){
      if(Math.abs(u-c)>1.15)continue;
      for(let f=0;f<nf;f++){
        if(zone&&zone.noWin0&&f===0)continue;
        const zw=fz[f];
        if(z>=zw-.22&&z<=zw+2.75){
          if(z<zw)return tc(CREAM,base-.4,i,j);
          if(z>zw+2.5)return tc(CREAM,base,i,j);
          if(Math.abs(u-c)>.9)continue;
          if(Math.abs(u-c)>.73||z<zw+.17||z>zw+2.33||Math.abs(u-c)<.05)return tc(CREAM,base,i,j);
          const left=u<c,open=hash(c*1.3,f+seed)>.5;
          if(left===open)return tc(SHUTR,base-.2-(i%2?.3:0),i,j);
          return tc(GLASS,base-.5+(z>zw+1.6&&u>c?.5:0),i,j);
        }
      }
    }
    if(nf===2&&z>=6.15&&z<=6.65)return tc(CREAM,base,i,j);
    if(z>h-4){const st=noise(u*2.2+seed,z*.15);if(st>.6)t-=(st-.6)*2.2*Math.min(1,(z-(h-4))/3);}
    return tc(pal,t,i,j);
  };
}
function topFn(b,o){
  const pal=o.topPal||ROOFP,seed=hash(b.x0,b.y0)*40;
  return(i,j)=>{
    const u=b.x0+(i+.5)/TF,v=b.y0+(j+.5)/TF,g=noise(u*.45+seed,v*.45);
    let p=pal,t=SHADE.T+(g-.5)*.9;
    if(!o.topPal&&noise(u*.2+seed,v*.2+9)>.68){p=MOSS;t-=.3;}
    if(o.stipple&&hash(i,j)>.9)t-=1.6;
    return tc(p,t,i,j);
  };
}
function plainFn(side,b,o){
  const pal=o.pal||CREAM,seed=hash(b.x0*2,b.y0)*40,base=SHADE[side];
  return(i,j)=>{
    const z=b.z1-(j+.5)/TF,u=(i+.5)/TF,g=noise(u*.9+seed,z*.5);
    let t=base+(g-.5)*.8;
    if(o.mould&&z<1)t-=(1-z)*.9*noise(u*3,z*2);
    return tc(pal,t,i,j);
  };
}
function addBox(x0,y0,x1,y1,z0,z1,o){
  o=o||{};const b={x0,y0,x1,y1,z0,z1},dx=x1-x0,dy=y1-y0,dz=z1-z0;
  for(const side of(o.sides||'SNEWT')){
    const tf=(o.tf&&o.tf[side])||TF,top=side==='T';
    let ox,oy,oz,ux=0,uy=0,uz=0,vx=0,vy=0,vz=0,nx=0,ny=0,nz=0,L1,L2;
    if(side==='S'||side==='N'){ox=x0;oy=side==='S'?y1:y0;oz=z1;ux=dx;vz=-dz;ny=side==='S'?1:-1;L1=dx;L2=dz;}
    else if(side==='E'||side==='W'){ox=side==='E'?x1:x0;oy=y0;oz=z1;uy=dy;vz=-dz;nx=side==='E'?1:-1;L1=dy;L2=dz;}
    else{ox=x0;oy=y0;oz=z1;ux=dx;vy=dy;nz=1;L1=dx;L2=dy;}
    const tw=Math.max(1,Math.round(L1*tf)),th=Math.max(1,Math.round(L2*tf));
    let fn=o.fn?o.fn(side,b,tf):null;
    if(!fn)fn=top?topFn(b,o):(o.wall?wallFn(side,b,o.wall):plainFn(side,b,o));
    mkFace({ox,oy,oz,ux,uy,uz,vx,vy,vz,nx,ny,nz,tw,th,fn,grp:o.grp||0});
  }
  if(o.col)colliders.push({x0,y0,x1,y1});
  if(o.cast)casters.push({x0,y0,x1,y1,h:z1});
}
function addBuilding(s){
  addBox(s.x0,s.y0,s.x1,s.y1,0,s.h,{wall:s,col:true,cast:true,sides:'SNEW'});
  addBox(s.x0-.35,s.y0-.35,s.x1+.35,s.y1+.35,s.h-.8,s.h+.1,{pal:CREAM});
}
const px20=v=>v/20;

/* ---------- ground texture (baked in world space) ---------- */
const TEX=6,GX0=-12,GY0=-12,GN=732;
const gnd=new Uint32Array(GN*GN);
const PATHS=[
 [[770,1050],[772,1150],[775,1280],[765,1355],[740,1385]],
 [[740,1385],[570,1410],[360,1418],[235,1424],[150,1380],[105,1280],[88,1100],[95,890]],
 [[740,1385],[860,1375],[960,1350],[985,1260],[988,1160],[1040,1125],[1140,1115],[1260,1122],[1340,1105],[1400,1075]],
 [[1400,1075],[1415,980],[1425,780],[1432,600],[1425,480],[1390,410],[1300,398],[1160,398],[1085,403],[1062,450],[1065,520],[1088,563]],
 [[1070,392],[900,382],[700,378],[580,382],[490,402],[472,480],[468,545],[462,598]],
 [[740,1385],[760,1440],[768,1515]]];
function bakeGround(){
  const N=GN*GN,pathM=new Uint8Array(N),shM=new Uint8Array(N),aoM=new Uint8Array(N),concM=new Uint8Array(N);
  const gi=(x,y)=>[Math.floor((x-GX0)*TEX),Math.floor((y-GY0)*TEX)];
  for(const P of PATHS){
    for(let s=0;s<P.length-1;s++){
      const a=P[s],b=P[s+1],len=Math.hypot(b[0]-a[0],b[1]-a[1])/20,n=Math.ceil(len/.25);
      for(let k=0;k<=n;k++){
        const x=px20(lerp(a[0],b[0],k/n)),y=px20(lerp(a[1],b[1],k/n)),r=(1.3+.3*noise(x*.5,y*.5))*TEX,R=Math.ceil(r),[cx,cy]=gi(x,y);
        for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
          if(dx*dx+dy*dy>r*r)continue;const gx=cx+dx,gy=cy+dy;
          if(gx>=0&&gy>=0&&gx<GN&&gy<GN)pathM[gy*GN+gx]=1;
        }
      }
    }
  }
  const rect=(m,x0,y0,x1,y1,v)=>{const[a,b]=gi(x0,y0),[c,d]=gi(x1,y1);for(let gy=Math.max(0,b);gy<=Math.min(GN-1,d);gy++)for(let gx=Math.max(0,a);gx<=Math.min(GN-1,c);gx++)m[gy*GN+gx]=v;};
  rect(concM,53.5,58.25,61.5,67.25,1);
  for(const c of casters){
    if(c.circle){
      const[cx,cy]=gi(c.x,c.y),R=Math.ceil(c.r*TEX);
      for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){if(dx*dx+dy*dy>R*R)continue;const gx=cx+dx,gy=cy+dy;if(gx>=0&&gy>=0&&gx<GN&&gy<GN)shM[gy*GN+gx]=1;}
      continue;
    }
    const vx=SHX*c.h,vy=SHY*c.h;
    const[a,b]=gi(c.x0+Math.min(0,vx)-.1,c.y0+Math.min(0,vy)-.1),[e,f]=gi(c.x1+Math.max(0,vx)+.1,c.y1+Math.max(0,vy)+.1);
    for(let gy=Math.max(0,b);gy<=Math.min(GN-1,f);gy++)for(let gx=Math.max(0,a);gx<=Math.min(GN-1,e);gx++){
      const x=GX0+(gx+.5)/TEX,y=GY0+(gy+.5)/TEX;
      let tlo=0,thi=1,ok=true;
      for(let ax=0;ax<2&&ok;ax++){
        const p=ax?y:x,v=ax?vy:vx,lo=ax?c.y0:c.x0,hi=ax?c.y1:c.x1;
        if(Math.abs(v)<1e-9){if(p<lo||p>hi)ok=false;}
        else{let t1=(p-hi)/v,t2=(p-lo)/v;if(t1>t2){const t=t1;t1=t2;t2=t;}tlo=Math.max(tlo,t1);thi=Math.min(thi,t2);if(tlo>thi)ok=false;}
      }
      if(ok)shM[gy*GN+gx]=1;
    }
    if(c.h>1.2){
      const[a2,b2]=gi(c.x0-1.2,c.y0-1.2),[e2,f2]=gi(c.x1+1.2,c.y1+1.2);
      for(let gy=Math.max(0,b2);gy<=Math.min(GN-1,f2);gy++)for(let gx=Math.max(0,a2);gx<=Math.min(GN-1,e2);gx++){
        const x=GX0+(gx+.5)/TEX,y=GY0+(gy+.5)/TEX,d=Math.hypot(Math.max(c.x0-x,0,x-c.x1),Math.max(c.y0-y,0,y-c.y1));
        if(d<1){const v=Math.round((1-d)*255);if(v>aoM[gy*GN+gx])aoM[gy*GN+gx]=v;}
      }
    }
  }
  const rEarth=rampOf(G_EARTH),rDry=rampOf(G_DRY),rGrass=rampOf(G_GRASS),rDeep=rampOf(G_DEEP),rConc=rampOf(CONC),rBrick=rampOf(BRICK);
  for(let gy=0;gy<GN;gy++){
    const y=GY0+(gy+.5)/TEX;
    for(let gx=0;gx<GN;gx++){
      const x=GX0+(gx+.5)/TEX,i=gy*GN+gx,n1=noise(x*.11+3,y*.11),n3=noise(x*.5,y*.5),n2=hash(gx,gy);
      let ramp,tone;
      if(concM[i]){ramp=rConc;tone=2.9+(n2>.9?-1.8:0)+(n3-.5)*.6;}
      else if(pathM[i]){
        ramp=rBrick;const row=Math.floor(gy/3),off=(row&1)*2;
        if(gy%3===2||(gx+off)%5===0)tone=1.3;else tone=2.5+hash((gx+off)/5|0,row)*1.1;
      }
      else if((x>71.5&&x<86.2&&y>15.5)||(x<15+3*n1&&y>83+2*n1)){ramp=n1>.5?rDeep:rGrass;tone=2.4+(n3-.5)*1.4;}
      else if(x<8.5||y<15.5||x>86.9){ramp=n1>.55?rDry:rGrass;tone=2.4+(n3-.5)*1.2;}
      else{ramp=n1>.52?rDry:rEarth;tone=2.5+(n3-.5)*1.1;if(n2>.94)ramp=rGrass;}
      let c=ramp[clamp(Math.floor(tone+(bayerAt(gx,gy)-.5)*.8),0,4)];
      if(shM[i])c=tintC(c,.54,.52,.72);
      else if(aoM[i]&&aoM[i]/255>bayerAt(gx+1,gy)*.8)c=tintC(c,.74,.72,.84);
      gnd[i]=c;
    }
  }
}

/* ---------- sphere / capsule splatting (from engine.js) ---------- */
let PLAYER=false;
function sphere(x,y,z,r,c,mode){
  const ramp=rampOf(c),p=proj(x,y,z),rp=Math.max(r*S,.75);
  const y0=Math.max(0,Math.floor(p.sy-rp)),y1=Math.min(H-1,Math.ceil(p.sy+rp)),x0=Math.max(0,Math.floor(p.sx-rp)),x1=Math.min(W-1,Math.ceil(p.sx+rp));
  for(let iy=y0;iy<=y1;iy++)for(let ix=x0;ix<=x1;ix++){
    const dx=(ix+.5-p.sx)/rp,dy=(iy+.5-p.sy)/rp,nn=dx*dx+dy*dy;if(nn>1)continue;
    const nz=Math.sqrt(1-nn),d=p.d+r*nz,i=iy*W+ix;
    let l=clamp(-.55*dx-.6*dy+.58*nz,0,1);
    if(mode==='rough')l+=(hash(ix,iy)-.5)*.55;
    if(dy>.35)l=Math.max(l,.12+dy*.24);
    let idx=mode==='solid'?clamp(Math.floor(l*4.4+.2),1,4):clamp(Math.floor(l*4.4+.2+(bayerAt(ix,iy)-.5)*.7),0,4);
    if(d<=zb[i]){if(PLAYER&&!pm[i]&&((ix+iy)&1)&&zb[i]-d<60)pix[i]=ramp[idx];continue;}
    zb[i]=d;if(PLAYER)pm[i]=1;
    pix[i]=ramp[idx];
  }
}
function capsule(a,b,r0,r1,colorOf,mode){
  const len=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]),n=Math.max(1,Math.ceil(len/(Math.min(r0,r1)*.45)));
  for(let k=0;k<=n;k++){const t=k/n,z=lerp(a[2],b[2],t);sphere(lerp(a[0],b[0],t),lerp(a[1],b[1],t),z,lerp(r0,r1,t),colorOf(z),mode);}
}

/* ---------- per-frame passes ---------- */
function drawGround(){
  const dX=cosY/S,dY=sinY/S;
  for(let iy=0;iy<H;iy++){
    const t=(iy+.5-OY)/S,ry=(t-OZ*ce)/se,rx0=(.5-OX)/S;
    let X=rx0*cosY-ry*sinY+PX,Y=rx0*sinY+ry*cosY+PY;
    const d=ry*ce;gdRow[iy]=d;
    const row=iy*W;
    for(let ix=0;ix<W;ix++){
      let gx=Math.floor((X-GX0)*TEX),gy=Math.floor((Y-GY0)*TEX);
      gx=gx<0?0:gx>=GN?GN-1:gx;gy=gy<0?0:gy>=GN?GN-1:gy;
      pix[row+ix]=gnd[gy*GN+gx];zb[row+ix]=d;X+=dX;Y+=dY;
    }
  }
}
function drawFaces(){
  const V0=-sinY*ce,V1=cosY*ce,V2=se;
  for(const f of faces){
    if(f.grp&&hidden[f.grp])continue;
    if(!f.two&&f.nx*V0+f.ny*V1+f.nz*V2<=0)continue;
    const X=f.ox-PX,Y=f.oy-PY,rx=X*cosY+Y*sinY,ry=-X*sinY+Y*cosY;
    const sx0=OX+rx*S,sy0=OY+(ry*se-(f.oz-OZ)*ce)*S,d0=ry*ce+f.oz*se;
    const urx=f.ux*cosY+f.uy*sinY,ury=-f.ux*sinY+f.uy*cosY,Ux=urx*S,Uy=(ury*se-f.uz*ce)*S,dU=ury*ce+f.uz*se;
    const vrx=f.vx*cosY+f.vy*sinY,vry=-f.vx*sinY+f.vy*cosY,Vx=vrx*S,Vy=(vry*se-f.vz*ce)*S,dV=vry*ce+f.vz*se;
    const det=Ux*Vy-Vx*Uy;if(Math.abs(det)<.5)continue;
    const minx=Math.min(sx0,sx0+Ux,sx0+Vx,sx0+Ux+Vx),maxx=Math.max(sx0,sx0+Ux,sx0+Vx,sx0+Ux+Vx);
    const miny=Math.min(sy0,sy0+Uy,sy0+Vy,sy0+Uy+Vy),maxy=Math.max(sy0,sy0+Uy,sy0+Vy,sy0+Uy+Vy);
    if(maxx<0||minx>=W||maxy<0||miny>=H)continue;
    const iy0=Math.max(0,Math.floor(miny)),iy1=Math.min(H-1,Math.ceil(maxy));
    const Ba=Vy/det,Ca=-Vx/det,Aa=(-Vy*sx0+Vx*sy0)/det,Bb=-Uy/det,Cb=Ux/det,Ab=(Uy*sx0-Ux*sy0)/det;
    const tex=f.tex,tw=f.tw,th=f.th,bias=f.bias;
    for(let iy=iy0;iy<=iy1;iy++){
      const py=iy+.5,ca=Aa+Ca*py,cb=Ab+Cb*py;let lo=-1e9,hi=1e9;
      if(Math.abs(Ba)<1e-9){if(ca<0||ca>=1)continue;}else{let p1=-ca/Ba,p2=(1-ca)/Ba;if(p1>p2){const t=p1;p1=p2;p2=t;}if(p1>lo)lo=p1;if(p2<hi)hi=p2;}
      if(Math.abs(Bb)<1e-9){if(cb<0||cb>=1)continue;}else{let p1=-cb/Bb,p2=(1-cb)/Bb;if(p1>p2){const t=p1;p1=p2;p2=t;}if(p1>lo)lo=p1;if(p2<hi)hi=p2;}
      if(lo>hi)continue;
      const ix0=Math.max(0,Math.ceil(lo-.5)),ix1=Math.min(W-1,Math.floor(hi-.5));
      for(let ix=ix0;ix<=ix1;ix++){
        const pxc=ix+.5,a=ca+Ba*pxc,b=cb+Bb*pxc;
        let ti=(a*tw)|0,tj=(b*th)|0;if(ti<0)ti=0;else if(ti>=tw)ti=tw-1;if(tj<0)tj=0;else if(tj>=th)tj=th-1;
        const c=tex[tj*tw+ti];if(!c)continue;
        const d=d0+a*dU+b*dV+bias,i=iy*W+ix;if(d<=zb[i])continue;
        zb[i]=d;pix[i]=c;
      }
    }
  }
}
const PUMPPIPES=[[[56.6,63.6,.3],[56.6,63.6,3.0]],[[56.6,63.6,3.0],[58.6,63.8,2.6]],[[58.6,63.8,.3],[58.6,63.8,2.6]],[[57.4,65,.3],[57.4,65,1.9]],[[57.4,65,1.9],[59.4,65,1.9]]];
const PIPELINES=[
 {c:PIPEC,p:[[55.5,54.3],[55,57],[55.4,58.4]]},
 {c:CABLE,p:[[60.8,64.8],[67,65],[68,61.5],[68,58.8],[72.9,58]]},
 {c:PIPEC,p:[[57,67.3],[56,70],[56.8,76],[56.5,83],[53.8,84.5],[53.4,87.5]]}];
function onScreen(x,y,z,rad){const p=proj(x,y,z);return p.sx>-rad&&p.sx<W+rad&&p.sy>-rad&&p.sy<H+rad;}
function drawProps(wt){
  for(const tr of trees){
    if(!onScreen(tr.x,tr.y,tr.s*2.5,tr.s*3.6*S))continue;
    const s=tr.s,b=()=>BARK;
    capsule([tr.x,tr.y,0],[tr.x+.3*s,tr.y+.1*s,2.2*s],.36*s,.22*s,b,'rough');
    capsule([tr.x+.3*s,tr.y+.1*s,2.2*s],[tr.x-.8*s,tr.y-.4*s,3.3*s],.2*s,.13*s,b,'rough');
    capsule([tr.x+.3*s,tr.y+.1*s,2.2*s],[tr.x+1.2*s,tr.y+.4*s,3.4*s],.2*s,.13*s,b,'rough');
    for(const l of tr.leaves){
      const reach=clamp((l.z-2.5)/(3*s*.5),.3,1),sw=(Math.sin(wt*.9+l.x*.5+l.z*.7)+.55*Math.sin(wt*2.3+l.k*1.7))*reach*.22;
      sphere(l.x+sw,l.y+sw*.4,l.z,l.r,l.c,'rough');
    }
  }
  for(const sh of shrubs){
    if(!onScreen(sh.x,sh.y,1,3*S))continue;
    for(const s of sh.sp)sphere(s.x,s.y,s.z,s.r,s.c,'rough');
  }
  for(const L of PIPELINES)for(let k=0;k<L.p.length-1;k++){
    const a=L.p[k],b=L.p[k+1];
    if(!onScreen((a[0]+b[0])/2,(a[1]+b[1])/2,.2,Math.hypot(b[0]-a[0],b[1]-a[1])*S))continue;
    capsule([a[0],a[1],.22],[b[0],b[1],.22],.2,.2,()=>L.c,'solid');
  }
  if(onScreen(57.4,63.4,1,8*S)){
    capsule([57.5,62.6,.4],[57.5,62.6,2.3],.5,.5,()=>PUMPC,'solid');
    sphere(57.5,62.6,2.4,.55,PUMPC,'gloss');
    for(const p of PUMPPIPES)capsule(p[0],p[1],.16,.16,()=>PIPEC,'solid');
  }
}
function shadeEdges(){
  const GY=ce/(S*se),EDGE=Math.max(.28,se/(S*Math.max(ce,.05))*1.7);
  for(let iy=1;iy<H-1;iy++){
    const g0=gdRow[iy],ga=gdRow[iy-1],gb=gdRow[iy+1];
    for(let ix=1;ix<W-1;ix++){
      const i=iy*W+ix,d=zb[i];if(d===g0||d<-1e8)continue;
      const a=i-W,b=i+W,c=i-1,e=i+1;
      if(zb[a]===ga||zb[b]===gb||zb[c]===g0||zb[e]===g0){pix[i]=tintC(pix[i],.68,.66,.76);}
      else if(d-zb[a]-GY>EDGE||d-zb[c]>EDGE){const p=pix[i];pix[i]=rgb(lerp(p&255,255,.3),lerp(p>>8&255,232,.3),lerp(p>>16&255,180,.22));}
      else if(zb[e]-d>EDGE||zb[b]-GY-d>EDGE){pix[i]=tintC(pix[i],.74,.72,.82);}

}
function drawTufts(wt){
  for(const t of tufts){
    const p=proj(t.x,t.y,0),bx=p.sx|0,by=p.sy|0;
    if(bx<-3||bx>=W+3||by<0||by>=H+30)continue;
    const gust=Math.sin(wt*.8+t.ph)+.5*Math.sin(wt*2.1+t.ph*2.3),hp=Math.max(1,Math.round(t.h*ce*S*.8));

}
function playerShadow(){

      const al=X*dirx+Y*diry,ac=-X*diry+Y*dirx,q=(al/1.5)*(al/1.5)+(ac/.65)*(ac/.65);

  }
}
const shirtF=z=>(Math.floor(z*3.2)%2?SHIRT:STRIPE),legsF=()=>LEGS,skinF=()=>SKIN,shoeF=()=>SHOE;
function drawPlayer(){
  PLAYER=true;
  const f=pl.face,fx=Math.cos(f),fy=Math.sin(f),sx=-fy,sy=fx,amp=pl.amp,run=pl.runK,ph=pl.phase;
  const P=(a,b,c)=>[pl.x+fx*a+sx*b,pl.y+fy*a+sy*b,pl.z+c];
  const stride=(.5+.35*run)*amp,lift=(.28+.2*run)*amp;
  const bob=Math.abs(Math.cos(ph))*.1*amp*(1+run)+Math.sin(T*2)*.012*(1-amp);
  const hipZ=1.28-.05*amp+bob,lean=(.08+.3*run)*amp,shA=Math.sin(lean)*.95,shZ=hipZ+Math.cos(lean)*.95;
  const neck=P(shA,0,shZ+.08),head=P(shA+Math.sin(lean)*.32,0,shZ+.36);
  for(const sd of[1,-1]){
    const s=sd>0?Math.sin(ph):-Math.sin(ph),c=sd>0?Math.cos(ph):-Math.cos(ph),fa=s*stride,fz=.12+Math.max(0,c)*lift;
    const hip=P(0,sd*.15,hipZ),knee=P(fa*.5+.1*amp,sd*.17,(hipZ+fz)/2+.05+Math.max(0,c)*lift*.5),foot=P(fa,sd*.17,fz);
    capsule(hip,knee,.17,.13,legsF,'solid');capsule(knee,foot,.13,.1,legsF,'solid');capsule(foot,P(fa+.2,sd*.17,fz-.03),.1,.09,shoeF,'solid');
    const arm=-s*.85*amp,sh=P(shA,sd*.36,shZ-.03);
    const el=P(shA+Math.sin(arm)*.46,sd*.4,shZ-.03-Math.cos(arm)*.46),hand=P(shA+Math.sin(arm+.25)*.9,sd*.42,shZ-.03-Math.cos(arm+.25)*.9);
    capsule(sh,el,.12,.1,shirtF,'solid');capsule(el,hand,.09,.08,skinF,'solid');
  }
  capsule(P(0,0,hipZ),neck,.3,.32,shirtF,'solid');
  capsule(neck,head,.11,.12,skinF,'solid');
  sphere(head[0],head[1],head[2],.24,SKIN,'solid');
  sphere(head[0]-fx*.06,head[1]-fy*.06,head[2]+.08,.205,HAIR,'solid');
  PLAYER=false;
}

/* ---------- player / input ---------- */
const pl={x:39.5,y:66.2,z:0,face:-Math.PI/2,sp:0,phase:0,amp:0,runK:0};
const keys={},joy={x:0,y:0};let runToggle=false,T=0,windT=0;
const heightAt=(x,y)=>{let h=0;for(const p of platforms)if(x>=p.x0&&x<=p.x1&&y>=p.y0&&y<=p.y1&&p.z>h)h=p.z;return h;};
function blocked(x,y){
  const r=.42;
  if(x<.5||x>96||y<.5||y>96.2)return true;
  for(const b of colliders)if(x>b.x0-r&&x<b.x1+r&&y>b.y0-r&&y<b.y1+r)return true;
  for(const t of treeCols)if((x-t.x)*(x-t.x)+(y-t.y)*(y-t.y)<(t.r+r)*(t.r+r))return true;
  return false;
}
function tryMove(dx,dy){
  let nx=pl.x+dx;if(!blocked(nx,pl.y)&&heightAt(nx,pl.y)-pl.z<=.62)pl.x=nx;
  let ny=pl.y+dy;if(!blocked(pl.x,ny)&&heightAt(pl.x,ny)-pl.z<=.62)pl.y=ny;
}
function update(dt){
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
  if(keys.q)cam.yaw+=1.8*dt;if(keys.e)cam.yaw-=1.8*dt;
  if(keys['+']||keys['='])cam.S=clamp(cam.S*(1+1.2*dt),4,22);if(keys['-'])cam.S=clamp(cam.S/(1+1.2*dt),4,22);
  if(keys['['])setEl(cam.el-.8*dt);if(keys[']'])setEl(cam.el+.8*dt);
  let mx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0)+joy.x,my=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0)+joy.y;
  const m=Math.hypot(mx,my),mag=Math.min(1,m),run=runToggle||keys.shift;
  let dirX=0,dirY=0;
  if(m>.08){dirX=(mx*cy-my*sy)/m;dirY=(mx*sy+my*cy)/m;}
  const target=m>.08?(run?10:5.5)*(mag<.25?.6:1):0;
  pl.sp+=(target-pl.sp)*Math.min(1,dt*10);
  if(pl.sp>.05){
    const steps=Math.ceil(pl.sp*dt/.25),sd=pl.sp*dt/steps;
    if(m>.08){pl.dx=dirX;pl.dy=dirY;}
    for(let k=0;k<steps;k++)tryMove((pl.dx||0)*sd,(pl.dy||0)*sd);
    let da=Math.atan2(pl.dy||0,pl.dx||1)-pl.face;da=Math.atan2(Math.sin(da),Math.cos(da));pl.face+=da*Math.min(1,dt*14);
  }
  pl.phase+=dt*pl.sp*.95;pl.amp=Math.min(1,pl.sp/5.5);pl.runK=clamp((pl.sp-5.5)/4.5,0,1);
  pl.z+=(heightAt(pl.x,pl.y)-pl.z)*Math.min(1,dt*14);
}
function setEl(v){cam.el=clamp(v,10*Math.PI/180,82*Math.PI/180);updateDial();}

/* ---------- render ---------- */
function render(){
  S=cam.S;cosY=Math.cos(cam.yaw);sinY=Math.sin(cam.yaw);ce=Math.cos(cam.el);se=Math.sin(cam.el);PX=pl.x;PY=pl.y;OZ=pl.z+1.3;
  zb.fill(-1e9);
  hidden[1]=pl.x>32&&pl.x<45.9&&pl.y>52.3&&pl.y<61.8;
  hidden[2]=pl.x>33.3&&pl.x<46.3&&pl.y>70&&pl.y<77;
  drawGround();drawFaces();drawProps(windT);shadeEdges();drawTufts(windT);playerShadow();pm.fill(0);drawPlayer();
  ctx.putImageData(img,0,0);
  needle.style.transform='rotate('+Math.atan2(-sinY,cosY)*180/Math.PI+'deg)';
}

/* ---------- UI ---------- */
const needle=document.getElementById('needle'),dialEl=document.getElementById('dial'),dialLbl=document.getElementById('dialLbl');
const D2R=Math.PI/180,EL0=10,EL1=80;
function updateDial(){
  const dpr=window.devicePixelRatio||1,s=96;dialEl.width=s*dpr;dialEl.height=s*dpr;
  const g=dialEl.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,s,s);
  g.fillStyle='rgba(255,255,255,.8)';g.strokeStyle='#2b2540';g.lineWidth=3;g.beginPath();g.arc(48,48,42,0,7);g.fill();g.stroke();
  g.lineWidth=2;
  for(let a=-135;a<=135;a+=27){const r=(a-90)*D2R;g.beginPath();g.moveTo(48+Math.cos(r)*33,48+Math.sin(r)*33);g.lineTo(48+Math.cos(r)*38,48+Math.sin(r)*38);g.stroke();}
  const deg=cam.el/D2R,a=(-135+(deg-EL0)/(EL1-EL0)*270-90)*D2R;
  g.lineWidth=4;g.strokeStyle='#d83a2e';g.beginPath();g.moveTo(48,48);g.lineTo(48+Math.cos(a)*30,48+Math.sin(a)*30);g.stroke();
  g.fillStyle='#2b2540';g.beginPath();g.arc(48,48,5,0,7);g.fill();
  dialLbl.textContent='ISO '+Math.round(deg)+'\u00b0';
}
function dialPoint(e){
  const r=dialEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  let a=Math.atan2(dx,-dy)/D2R;a=clamp(a,-135,135);setEl((EL0+(a+135)/270*(EL1-EL0))*D2R);
}
let dialDrag=false;
dialEl.addEventListener('pointerdown',e=>{dialDrag=true;dialEl.setPointerCapture(e.pointerId);dialPoint(e);e.preventDefault();});
dialEl.addEventListener('pointermove',e=>{if(dialDrag)dialPoint(e);});
dialEl.addEventListener('pointerup',()=>{dialDrag=false;});
dialEl.addEventListener('pointercancel',()=>{dialDrag=false;});
dialEl.addEventListener('wheel',e=>{setEl(cam.el+(e.deltaY>0?-1:1)*3*D2R);e.preventDefault();},{passive:false});

const stickZone=document.getElementById('stickZone'),stick=document.getElementById('stick'),knob=document.getElementById('knob');
let stickId=null;
function stickMove(e){
  const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2-8;
  let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/R;joy.y=dy/R;
}
stickZone.addEventListener('pointerdown',e=>{stickId=e.pointerId;stickZone.setPointerCapture(e.pointerId);stickMove(e);e.preventDefault();});
stickZone.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
const stickEnd=e=>{if(e.pointerId!==stickId)return;stickId=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)';};
stickZone.addEventListener('pointerup',stickEnd);stickZone.addEventListener('pointercancel',stickEnd);

const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){cam.yaw+=(e.clientX-p.x)*.008;}
  else if(ptrs.size===2){
    const o=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
    const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    if(d0>10)cam.S=clamp(cam.S*d1/d0,4,22);
    const a0=Math.atan2(p.y-o.y,p.x-o.x),a1=Math.atan2(e.clientY-o.y,e.clientX-o.x);
    let da=a1-a0;da=Math.atan2(Math.sin(da),Math.cos(da));cam.yaw-=da;
  }
  p.x=e.clientX;p.y=e.clientY;
});
const ptrEnd=e=>ptrs.delete(e.pointerId);
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{cam.S=clamp(cam.S*(e.deltaY>0?.9:1.1),4,22);e.preventDefault();},{passive:false});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Shift')keys.shift=true;if(e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='Shift')keys.shift=false;});
document.getElementById('zin').onclick=()=>{cam.S=clamp(cam.S*1.2,4,22);};
document.getElementById('zout').onclick=()=>{cam.S=clamp(cam.S/1.2,4,22);};
document.getElementById('reset').onclick=()=>{cam.yaw=DEF.yaw;cam.S=DEF.S;setEl(DEF.el);};
const runBtn=document.getElementById('run');
runBtn.onclick=()=>{runToggle=!runToggle;runBtn.classList.toggle('on',runToggle);};
addEventListener('resize',resize);

function init(){
  resize();buildScene();updateDial();
  document.getElementById('loading').style.display='none';
  setTimeout(()=>{document.getElementById('hint').style.opacity=0;},9000);
  let last=0;
  const loop=ts=>{const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;windT=Math.floor(T*8)/8;update(dt);render();requestAnimationFrame(loop);};
  requestAnimationFrame(loop);
}
setTimeout(init,40);
</script></body></html>
