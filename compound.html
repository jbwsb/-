<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Compound - isometric pixel diorama</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #1c1b19; }
  #stage { position: fixed; left: 0; top: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; line-height: 0; }
  #c { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #dbg { position: absolute; left: 0; top: 0; pointer-events: none; }
  #hud { position: fixed; left: 8px; top: max(8px, env(safe-area-inset-top)); white-space: pre; pointer-events: none;
    font-size: 11px; line-height: 1.4; color: #1c1b19; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  #hint { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; pointer-events: none; color: #6b675e; font-size: 11px; }
  body.touch #hint { display: none; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; height: 172px; display: none; }
  body.touch #pad { display: block; }
  #stick { position: absolute; left: 22px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 124px; height: 124px;
    border-radius: 50%; border: 2px solid #1c1b19; background: rgba(255,255,255,.7); touch-action: none; }
  #knob { position: absolute; left: 36px; top: 36px; width: 48px; height: 48px; border-radius: 50%; background: #1c1b19; }
  #btns { position: absolute; right: 14px; bottom: calc(24px + env(safe-area-inset-bottom)); display: grid;
    grid-template-columns: repeat(3, 58px); gap: 8px; }
  button { font: inherit; font-size: 13px; height: 46px; border: 2px solid #1c1b19; background: #fff; color: #1c1b19;
    border-radius: 0; padding: 0; touch-action: none; }
  button.on { background: #1c1b19; color: #fff; }
  button:focus-visible { outline: 3px solid #2a6cdf; outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="c"></canvas><canvas id="dbg"></canvas></div></div>
<div id="hud"></div>
<div id="hint">WASD / arrows move &middot; Q E or drag to rotate &middot; wheel zoom &middot; F debug &middot; L light &middot; Shift run</div>
<div id="pad">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button id="bL" aria-label="Rotate left">&#x27F2;</button>
    <button id="bR" aria-label="Rotate right">&#x27F3;</button>
    <button id="bD">DBG</button>
    <button id="bZm" aria-label="Zoom out">&minus;</button>
    <button id="bZp" aria-label="Zoom in">+</button>
    <button id="bLt">LIT</button>
  </div>
</div>

<script>
(() => {
'use strict';
/* =====================================================================
   COMPOUND - isometric pixel diorama, built from the hand-drawn blueprint.
   Software rasteriser: per-pixel ray casts, depth buffer, Bayer dither,
   hue-shifted ramps, depth-buffer edges. No images, no libraries.
   World units: 1 u = 1 blueprint-pixel * K. Human = 2.8 u (~1.8 m).
   ===================================================================== */

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- tunables (all dimensions live here so debug stays honest) ---------- */
const K = 0.068;                 // blueprint px -> world units
const HUMAN_H = 2.8;             // person height (u)
const STOREY = 3.4;              // one storey (u)
const BLD_H = STOREY * 4;        // 4-storey white buildings
const CHAMBER_H = STOREY;        // chambers: ASSUMED one storey (not given in the blueprint)
const WALL_H = 3.6, WALL_T = 0.9;// main white wall; the net fence is the same height
const ROOF_Z0 = 4.4, ROOF_Z1 = 5.0; // roof extension slab
const PILLAR_R = 0.8;
const PATH_W = 3.2;              // orange trail = pavement width
const M_PER_U = 1.8 / HUMAN_H;   // debug only: metres per unit

/* ---------- camera maths (same 30 degree orthographic camera as pixel-plays) ---------- */
const SIN = .5, COS = Math.sqrt(3) / 2, R2 = Math.SQRT2;
const DZ = R2 * SIN / COS;       // view-ray z per unit t, with camera-space ray (1,1,DZ)
const KD = R2 * COS + DZ * SIN;  // depth gained per unit t along the ray
const GRADIENT_UNIT = COS / SIN; // ground depth per row = GRADIENT_UNIT / SS
const EDGE = .28;

let W = 360, H = 280, SS = 8, OX = 180, OY = 170;
let canvas, ctx, image, pix, zb, groundZ, shadowMask, gxMap, gyMap, rowD0;
let dbg, dctx, dbgK = 1, cssScale = 1;
const cam = { yaw: 0 };
const player = { x: 0, y: 0, yaw: -Math.PI / 2, phase: 0, moving: 0 };
let cs = 1, sn = 0, px = 0, py = 0;
let LHx = -.7071, LHy = .7071, SXo = .85, SYo = -.85;   // light (toward) & shadow offset per unit height
const SK = 1.2;
let lightLocked = true, debug = false;
let pcx = 0, pcy = 0, pDepth = 0;

const rgb = (r, g, b) => (255 << 24 | Math.min(255, b | 0) << 16 | Math.min(255, g | 0) << 8 | Math.min(255, r | 0)) >>> 0;
const WHITE_PX = rgb(255, 255, 255);
const COOL = [46, 38, 84], WARM = [255, 232, 180];
const rampCache = new Map();
function rampOf(c) {            // hue-shifted ramp: shadows drift violet, lights drift warm
  const key = c.join(',');
  let r = rampCache.get(key);
  if (r) return r;
  const mix = (m, t, k) => rgb(lerp(c[0] * m, t[0], k), lerp(c[1] * m, t[1], k), lerp(c[2] * m, t[2], k));
  r = [mix(.4, COOL, .34), mix(.62, COOL, .18), mix(.84, COOL, .05), mix(1, WARM, 0), mix(1.1, WARM, .22)];
  rampCache.set(key, r);
  return r;
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const bayerAt = (ix, iy) => BAYER[(iy & 3) * 4 + (ix & 3)];
function ih(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = ih(ix, iy), b = ih(ix + 1, iy), c = ih(ix, iy + 1), d = ih(ix + 1, iy + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function tint(i, r, g, b) {
  const c = pix[i];
  pix[i] = rgb((c & 255) * r, (c >> 8 & 255) * g, (c >> 16 & 255) * b);
}

/* world -> screen (camera follows the player, rotated by cam.yaw) */
const _p = { sx: 0, sy: 0, d: 0 };
function proj(x, y, z) {
  const dx = x - px, dy = y - py;
  const cx = dx * cs - dy * sn, cy = dx * sn + dy * cs;
  const v = (cx + cy) / R2;
  _p.sx = OX + (cx - cy) / R2 * SS;
  _p.sy = OY + (v * SIN - z * COS) * SS;
  _p.d = v * COS + z * SIN;
  return _p;
}

/* =====================================================================
   THE BLUEPRINT  (coordinates are blueprint pixels; P() / K convert to u)
   ===================================================================== */
const LAND = { x0: -90 * K, y0: -560 * K, x1: 2140 * K, y1: 2060 * K };
const CELL = .5, INVC = 1 / CELL;
const GW = Math.ceil((LAND.x1 - LAND.x0) * INVC), GH = Math.ceil((LAND.y1 - LAND.y0) * INVC);
const grid = new Uint8Array(GW * GH);
const M = { VOID: 0, OUT: 1, PLAIN: 2, PAVE: 3, GRASS: 4, FIELD: 5, COURT: 6, ASPH: 7, ROOFF: 8 };
const MAT_NAME = ['void', 'outside ground', 'plain ground', 'pavement path', 'grass (walkable)', 'field (trimmed grass)', 'basketball court', 'asphalt road', 'roof-extension floor'];
const P = pts => pts.map(([x, y]) => [x * K, y * K]);

function inPoly(x, y, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
}
function paintPoly(poly, m) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of poly) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const i0 = Math.max(0, Math.floor((x0 - LAND.x0) * INVC)), i1 = Math.min(GW - 1, Math.ceil((x1 - LAND.x0) * INVC));
  const j0 = Math.max(0, Math.floor((y0 - LAND.y0) * INVC)), j1 = Math.min(GH - 1, Math.ceil((y1 - LAND.y0) * INVC));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    if (inPoly(LAND.x0 + (i + .5) * CELL, LAND.y0 + (j + .5) * CELL, poly)) grid[j * GW + i] = m;
  }
}
const paintRect = (x0, y0, x1, y1, m) => paintPoly(P([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]), m);
function distSeg(x, y, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((x - ax) * dx + (y - ay) * dy) / l2, 0, 1) : 0;
  return Math.hypot(x - (ax + t * dx), y - (ay + t * dy));
}
function paintStroke(pts, w, m) {
  const q = P(pts), r = w / 2;
  for (let s = 0; s < q.length - 1; s++) {
    const [ax, ay] = q[s], [bx, by] = q[s + 1];
    const i0 = Math.max(0, Math.floor((Math.min(ax, bx) - r - LAND.x0) * INVC)), i1 = Math.min(GW - 1, Math.ceil((Math.max(ax, bx) + r - LAND.x0) * INVC));
    const j0 = Math.max(0, Math.floor((Math.min(ay, by) - r - LAND.y0) * INVC)), j1 = Math.min(GH - 1, Math.ceil((Math.max(ay, by) + r - LAND.y0) * INVC));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      if (distSeg(LAND.x0 + (i + .5) * CELL, LAND.y0 + (j + .5) * CELL, ax, ay, bx, by) <= r) grid[j * GW + i] = m;
    }
  }
}
function matAt(x, y) {
  const i = Math.floor((x - LAND.x0) * INVC), j = Math.floor((y - LAND.y0) * INVC);
  return i < 0 || j < 0 || i >= GW || j >= GH ? 0 : grid[j * GW + i];
}

/* ---- ground layers, painted in order ---- */
grid.fill(M.OUT);
// everything inside the white wall
paintPoly(P([[60, 105], [435, 100], [445, -560], [1900, -560], [1900, 205], [1690, 235], [1655, 300], [1650, 560], [1700, 605],
  [1840, 635], [1850, 1200], [1660, 1245], [1580, 1238], [930, 1232], [930, 1895], [40, 1895], [30, 1670], [85, 950], [25, 925],
  [25, 575], [60, 555]]), M.PLAIN);
// the "Field": extended plain trimmed grass, runs off the top of the map
paintPoly(P([[950, -560], [1900, -560], [1900, 205], [1690, 235], [1655, 300], [1650, 420], [950, 420]]), M.FIELD);
// "Grass" walkable areas
paintRect(482, 330, 622, 912, M.GRASS);        // strip beside the court, with the tree
paintRect(92, 1262, 436, 1620, M.GRASS);       // lower-left lawn
paintRect(990, 400, 1560, 1045, M.GRASS);      // park + grass block
// grass verge outside the gate / entrance (between wall and road)
paintPoly(P([[940, 1245], [1860, 1245], [1860, 1298], [1552, 1298], [1190, 1342], [1122, 1400], [1128, 1845], [1480, 1855],
  [1565, 1885], [1570, 2060], [940, 2060]]), M.GRASS);
// asphalt road outside the gate
paintPoly(P([[1190, 1342], [1552, 1298], [2140, 1298], [2140, 2060], [1570, 2060], [1565, 1885], [1480, 1855], [1128, 1845], [1122, 1400]]), M.ASPH);
// orange trail = pavement
const TRAILS = [
  [[738, -560], [738, 48], [745, 130], [775, 230], [790, 330], [790, 420], [785, 520], [797, 600], [812, 720], [825, 900], [845, 1050], [853, 1125], [832, 1155], [816, 1230], [822, 1330], [800, 1372]],
  [[853, 1125], [1000, 1114], [1250, 1106], [1510, 1108], [1562, 1140], [1590, 1200], [1600, 1245], [1600, 1300]],
  [[757, 150], [960, 125]],
  [[783, 520], [1000, 503]],
  [[1600, 1285], [1590, 1150], [1590, 1000], [1600, 800], [1620, 732], [1665, 708]],
  [[1590, 1062], [1655, 1062]],
  [[800, 1372], [700, 1356], [500, 1350], [262, 1362], [238, 1340], [228, 1262], [150, 1256], [130, 1150], [125, 930], [110, 700], [100, 300], [104, 205], [200, 170], [280, 150], [400, 158], [450, 172], [466, 260], [466, 330], [620, 326], [790, 322]],
  [[600, 170], [628, 350], [632, 600], [630, 880], [604, 905], [470, 916], [130, 925]],
  [[790, 1375], [785, 1440], [752, 1478], [520, 1480], [522, 1560], [528, 1660]],
];
for (const t of TRAILS) paintStroke(t, PATH_W, M.PAVE);
const COURT = { x0: 120 * K, y0: 490 * K, x1: 470 * K, y1: 905 * K };
paintRect(120, 490, 470, 905, M.COURT);          // open basketball court, blue floor
paintRect(440, 1365, 710, 1575, M.ROOFF);        // floor under the roof extension

/* =====================================================================
   SOLID GEOMETRY: axis-aligned boxes + vertical cylinders, hit per pixel
   ===================================================================== */
const BOXES = [];
function addBox(o) {
  const b = Object.assign({ solid: true, cut: true, tex: 'plain', type: 'box' }, o);
  b.ramp = rampOf(b.color);
  BOXES.push(b);
  return b;
}
const bp = (kind, name, x0, y0, x1, y1, z0, z1, color, extra) =>
  addBox(Object.assign({ kind, name, x0: x0 * K, y0: y0 * K, x1: x1 * K, y1: y1 * K, z0, z1, color }, extra));

const C_WALL = [238, 236, 230], C_BLD = [246, 244, 238], C_CHAMBER = [226, 208, 176], C_NET = [84, 96, 118];
let nW = 0;
function wallSeg(ax, ay, bx, by) {            // axis-aligned wall run, centre-line in blueprint px
  const h = WALL_T / 2 / K;
  bp('wall', 'WALL ' + (++nW), Math.min(ax, bx) - h, Math.min(ay, by) - h, Math.max(ax, bx) + h, Math.max(ay, by) + h, 0, WALL_H, C_WALL, { tex: 'wall' });
}
let nF = 0;
function fenceSeg(ax, ay, bx, by) {           // net fence: same height as the wall
  const vert = ax === bx, h = .07 / K;
  const x0 = Math.min(ax, bx) - (vert ? h : 0), x1 = Math.max(ax, bx) + (vert ? h : 0);
  const y0 = Math.min(ay, by) - (vert ? 0 : h), y1 = Math.max(ay, by) + (vert ? 0 : h);
  bp('fence', 'NET FENCE ' + (++nF), x0, y0, x1, y1, 0, WALL_H, C_NET, { tex: 'net', cut: false });
  const len = vert ? Math.abs(by - ay) : Math.abs(bx - ax), n = Math.max(1, Math.round(len / 100));
  const q = .2 / K;
  for (let i = 0; i <= n; i++) {
    const t = i / n, cx = lerp(ax, bx, t), cy = lerp(ay, by, t);
    bp('fencepost', 'post', cx - q, cy - q, cx + q, cy + q, 0, WALL_H + .25, [70, 78, 96], { cut: false });
  }
}
// main white wall (blueprint's thick brown line)
wallSeg(60, 102, 440, 102);  wallSeg(440, -560, 440, 102);
wallSeg(58, 102, 58, 558);   wallSeg(25, 558, 58, 558);  wallSeg(25, 558, 25, 938);  wallSeg(25, 938, 85, 938);
wallSeg(30, 1660, 85, 1660); wallSeg(30, 1660, 30, 1895); wallSeg(30, 1895, 930, 1895);
wallSeg(930, 1895, 930, 1560);                       // gate opening 1350..1560
wallSeg(930, 1350, 930, 1236);
wallSeg(930, 1236, 1580, 1236);                      // entrance opening 1580..1662
wallSeg(1662, 1240, 1850, 1240); wallSeg(1850, 630, 1850, 1240); wallSeg(1652, 630, 1850, 630);
wallSeg(1652, 232, 1652, 630);   wallSeg(1652, 232, 1900, 232); wallSeg(1900, -560, 1900, 232);
// net fences (the X lines)
fenceSeg(940, -560, 940, 100); fenceSeg(940, 150, 940, 415);   // gap where the path crosses into the field
fenceSeg(675, 410, 680, 975);
fenceSeg(85, 945, 85, 1655);
// gate + entrance pillars
const gatePil = (x, y) => bp('gate', 'GATE PILLAR', x - 8, y - 8, x + 8, y + 8, 0, 4.6, C_WALL, { tex: 'wall' });
gatePil(930, 1350); gatePil(930, 1560);
bp('entrance', 'ENTRANCE PILLAR', 1572, 1228, 1588, 1244, 0, 4.6, C_WALL, { tex: 'wall' });
bp('entrance', 'ENTRANCE PILLAR', 1654, 1232, 1670, 1248, 0, 4.6, C_WALL, { tex: 'wall' });

// 4-storey white buildings (cross-hatched on the blueprint)
bp('building', 'BUILDING A', 110, 170, 440, 480, 0, BLD_H, C_BLD, { tex: 'bld' });
bp('building', 'BUILDING B', 165, 930, 685, 1230, 0, BLD_H, C_BLD, { tex: 'bld' });
bp('building', 'BUILDING C', 45, 1620, 350, 1880, 0, BLD_H, C_BLD, { tex: 'bld' });
bp('building', 'BUILDING D', 385, 1575, 805, 1890, 0, BLD_H, C_BLD, { tex: 'bld' });
// chambers (single-slash boxes) - not enterable
bp('chamber', 'CHAMBER 1', 1690, 650, 1840, 880, 0, CHAMBER_H, C_CHAMBER, { tex: 'chamber' });
bp('chamber', 'CHAMBER 2', 1675, 905, 1820, 1110, 0, CHAMBER_H, C_CHAMBER, { tex: 'chamber' });
bp('chamber', 'CHAMBER 3', 1655, 1125, 1830, 1215, 0, CHAMBER_H, C_CHAMBER, { tex: 'chamber' });
// roof extension: slab on two big pillars, chairs only under its right side
bp('roof', 'ROOF EXTENSION', 440, 1365, 710, 1575, ROOF_Z0, ROOF_Z1, [228, 224, 214], { solid: false });
for (const [cx, cy] of [[480, 1395], [655, 1395]]) {
  const r = PILLAR_R;
  addBox({ kind: 'pillar', name: 'BIG PILLAR', type: 'cyl', cx: cx * K, cy: cy * K, r, x0: cx * K - r, x1: cx * K + r, y0: cy * K - r, y1: cy * K + r, z0: 0, z1: ROOF_Z0, color: [244, 242, 236], tex: 'pillar' });
}
for (const cy of [1490, 1535]) for (const cx of [590, 630, 670]) {
  const s = .55 / K;
  bp('chair', 'CHAIR', cx - s, cy - s, cx + s, cy + s, .6, .95, [206, 96, 66], {});                  // seat
  bp('chair', 'CHAIR', cx - s, cy - s, cx + s, cy - s + .22 / K, .95, 1.9, [206, 96, 66], {});        // back
  bp('chair', 'CHAIR', cx - s * .55, cy - s * .55, cx + s * .55, cy + s * .55, 0, .6, [150, 70, 50], {}); // base
}
// basketball hoops (court ends)
for (const [yb, yp] of [[500, 528], [900, 872]]) {
  const cx = 295;
  bp('hoop', 'HOOP POLE', cx - 3, (yb < 700 ? 523 : 893) - 3, cx + 3, (yb < 700 ? 523 : 893) + 3, 0, 5.8, [92, 92, 104], {});
  bp('hoop', 'BACKBOARD', cx - 22, yp - 3, cx + 22, yp + 3, 4.5, 6.7, [236, 236, 242], { solid: false });
}
// under-construction sign at the top ("close")
const SIGN = { x0: 515, x1: 615, y: 62, z0: 2.1, z1: 4.7 };
bp('sign', 'SIGN LEG', 523, 58, 529, 66, 0, SIGN.z0, [70, 70, 76], {});
bp('sign', 'SIGN LEG', 601, 58, 607, 66, 0, SIGN.z0, [70, 70, 76], {});
bp('sign', 'UNDER CONSTRUCTION SIGN', SIGN.x0, SIGN.y - 2, SIGN.x1, SIGN.y + 2, SIGN.z0, SIGN.z1, [250, 205, 40], { tex: 'sign', solid: false });

/* collision set: anything that reaches head height */
const SOLIDS = BOXES.filter(b => b.solid && b.z0 < HUMAN_H);

/* =====================================================================
   SPHERES: trees, palms, hoop rims (rendered per frame so they rotate)
   ===================================================================== */
const SPH = [];                 // {x,y,z,r,ramp,mode,leaf,k}
const SHADOW_ELL = [];          // static ellipse stamps {x,y,z,r}
const BARK = [92, 74, 60], LEAF_DEEP = [58, 84, 62], LEAF_MID = [100, 126, 78], LEAF_SILVER = [146, 162, 112];
const PALM_LEAF = [52, 104, 60], PALM_LEAF2 = [92, 140, 70];
function chain(a, b, r0, r1, col, mode, leaf, k0) {
  const len = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
  const n = Math.max(1, Math.ceil(len / (Math.min(r0, r1) * .5)));
  const ramp = rampOf(col);
  for (let k = 0; k <= n; k++) {
    const t = k / n;
    SPH.push({ x: lerp(a[0], b[0], t), y: lerp(a[1], b[1], t), z: lerp(a[2], b[2], t), r: lerp(r0, r1, t), ramp, mode, leaf: !!leaf, k: (k0 || 0) + k });
  }

    if (Math.hypot(cx - player.x, cy - player.y) > 70) continue;
    g.strokeStyle = z.col; g.beginPath();
    [[z.x0, z.y0], [z.x1, z.y0], [z.x1, z.y1], [z.x0, z.y1]].forEach(([x, y], i) => { const a = T(x * K, y * K, .05); i ? g.lineTo(a[0], a[1]) : g.moveTo(a[0], a[1]); });
    g.closePath(); g.stroke();
    const a = T(clamp(player.x, z.x0 * K + 2, z.x1 * K - 2) * 0 + cx, cy, .05);
    label(z.name + '  ' + fmt((z.x1 - z.x0) * K) + ' x ' + fmt((z.y1 - z.y0) * K) + 'u', a[0], a[1], z.col);
  }
  g.setLineDash([]);
  for (const m of MARKS) {
    if (Math.hypot(m.x * K - player.x, m.y * K - player.y) > 60) continue;
    const a = T(m.x * K, m.y * K, m.z); label(m.name, a[0], a[1], '#111');
  }
  // boxes: wireframe + dimensions
  const nearest = {};
  for (const b of BOXES) {
    if (b.kind !== 'wall' && b.kind !== 'fence') continue;
    const d = Math.hypot((b.x0 + b.x1) / 2 - player.x, (b.y0 + b.y1) / 2 - player.y);
    if (!nearest[b.kind] || d < nearest[b.kind].d) nearest[b.kind] = { b, d };
  }
  for (const b of BOXES) {
    if (!b._vis || b.kind === 'fencepost') continue;
    const cxw = (b.x0 + b.x1) / 2, cyw = (b.y0 + b.y1) / 2;
    if (Math.hypot(cxw - player.x, cyw - player.y) > 75 && (b.x1 - b.x0 < 40 && b.y1 - b.y0 < 40)) continue;
    const col = BOX_COL[b.kind] || '#333';
    g.strokeStyle = col; g.lineWidth = Math.max(1, dpr);
    const c8 = [];
    for (let c = 0; c < 8; c++) c8.push(T(c & 1 ? b.x1 : b.x0, c & 2 ? b.y1 : b.y0, c & 4 ? b.z1 : b.z0));
    g.beginPath();
    for (const [a, bb] of EDGES) { g.moveTo(c8[a][0], c8[a][1]); g.lineTo(c8[bb][0], c8[bb][1]); }
    g.stroke();
    const w = b.x1 - b.x0, d = b.y1 - b.y0, h = b.z1 - b.z0;
    const big = b.kind === 'building' || b.kind === 'chamber' || b.kind === 'roof' || b.kind === 'pillar' || b.kind === 'sign' || b.kind === 'gate' || b.kind === 'entrance';
    if (big || (nearest[b.kind] && nearest[b.kind].b === b)) {
      const top = T(cxw, cyw, b.z1);
      let txt = b.name + '  ' + fmt(w) + ' x ' + fmt(d) + ' x ' + fmt(h) + 'u';
      if (b.kind === 'building') txt += '  (4 storeys x ' + STOREY + ')';
      if (b.kind === 'wall') txt = 'WALL  h' + fmt(WALL_H) + ' thick ' + fmt(WALL_T) + 'u';
      if (b.kind === 'fence') txt = 'NET FENCE  h' + fmt(WALL_H) + 'u (= wall height)';
      if (b.kind === 'roof') txt += '  slab z ' + fmt(b.z0) + '-' + fmt(b.z1);
      if (b.kind === 'chamber') txt += '  (height assumed)';
      label(txt, top[0], top[1] - 6 * dpr, col);
      if (b.kind === 'building' || b.kind === 'chamber' || b.kind === 'pillar') {      // vertical height dimension
        const a = T(b.x1, b.y1, b.z0), c = T(b.x1, b.y1, b.z1);
        g.strokeStyle = col; g.beginPath(); g.moveTo(a[0] + 6 * dpr, a[1]); g.lineTo(c[0] + 6 * dpr, c[1]);
        g.moveTo(a[0] + 2 * dpr, a[1]); g.lineTo(a[0] + 10 * dpr, a[1]); g.moveTo(c[0] + 2 * dpr, c[1]); g.lineTo(c[0] + 10 * dpr, c[1]); g.stroke();
        label('h ' + fmt(h) + 'u', a[0] + 8 * dpr, (a[1] + c[1]) / 2, col);
      }
    }
  }
  // the walker: height gauge and axes
  { const a = T(player.x, player.y, 0), c = T(player.x, player.y, HUMAN_H), o = 22 * dpr;
    g.strokeStyle = '#d6249f'; g.beginPath(); g.moveTo(a[0] + o, a[1]); g.lineTo(c[0] + o, c[1]);
    g.moveTo(a[0] + o - 4 * dpr, a[1]); g.lineTo(a[0] + o + 4 * dpr, a[1]); g.moveTo(c[0] + o - 4 * dpr, c[1]); g.lineTo(c[0] + o + 4 * dpr, c[1]); g.stroke();
    label('HUMAN ' + fmt(HUMAN_H) + 'u', a[0] + o + 28 * dpr, (a[1] + c[1]) / 2, '#d6249f');
    const ax = [[5, 0, 0, '#d33', 'x'], [0, 5, 0, '#2a2', 'y'], [0, 0, 5, '#33d', 'z']];
    for (const [dx, dy, dz, col, n] of ax) {
      const e = T(player.x + dx, player.y + dy, dz); g.strokeStyle = col; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(e[0], e[1]); g.stroke(); label(n, e[0], e[1], col);
    }
  }
  const m = matAt(player.x, player.y);
  $('hud').textContent =
    'x ' + fmt(player.x) + '  y ' + fmt(player.y) + '  yaw ' + Math.round(((cam.yaw * 180 / Math.PI) % 360 + 360) % 360) + 'deg  zoom ' + SS + '  fps ' + fps + '\n' +
    'ground: ' + MAT_NAME[m] + '\n' +
    'light: ' + (lightLocked ? 'locked to camera' : 'fixed sun') + '\n' +
    '1u = ' + M_PER_U.toFixed(2) + 'm  human ' + HUMAN_H + 'u  storey ' + STOREY + 'u\n' +
    'wall/fence h' + WALL_H + 'u  path w' + PATH_W + 'u  roof z' + ROOF_Z0 + '-' + ROOF_Z1 + 'u';
}

/* =====================================================================
   BOOT
   ===================================================================== */
function alloc(w, h) {
  W = w; H = h;
  canvas.width = W; canvas.height = H;
  image = ctx.createImageData(W, H);
  pix = new Uint32Array(image.data.buffer);
  zb = new Float32Array(W * H); groundZ = new Float32Array(W * H); shadowMask = new Uint8Array(W * H);
  gxMap = new Float32Array(W * H); gyMap = new Float32Array(W * H); rowD0 = new Float32Array(H);
  OX = W / 2; OY = H / 2 + Math.round(H * .07);
}
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const touch = document.body.classList.contains('touch');
  const aw = innerWidth, ah = innerHeight - (touch ? 172 : 0);
  $('stage').style.height = ah + 'px';
  const a = aw / ah;
  let w, h;
  if (a >= 1) { h = 300; w = clamp(Math.round(h * a), 300, 560); } else { w = 340; h = clamp(Math.round(w / a), 300, 600); }
  if (w !== W || h !== H || !pix) alloc(w, h);
  cssScale = Math.max(1, Math.floor(Math.min(aw / W, ah / H) * dpr)) / dpr;
  canvas.style.width = W * cssScale + 'px'; canvas.style.height = H * cssScale + 'px';
  dbg.style.width = W * cssScale + 'px'; dbg.style.height = H * cssScale + 'px';
  dbg.width = Math.round(W * cssScale * dpr); dbg.height = Math.round(H * cssScale * dpr);
  dbgK = cssScale * dpr;
}

canvas = $('c'); ctx = canvas.getContext('2d');
dbg = $('dbg'); dctx = dbg.getContext('2d');
if (('ontouchstart' in window) || (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches)) document.body.classList.add('touch');
// start just outside the ENTER arrow, facing in
player.x = 1598 * K; player.y = 1318 * K;
fit();
addEventListener('resize', fit);

let last = 0, fpsN = 0, fpsT = 0, fpsShown = 0;
function frame(ts) {
  const dt = Math.min(.05, last ? (ts - last) / 1000 : .016);
  last = ts;
  update(dt);
  render(ts / 1000);
  fpsN++; fpsT += dt;
  if (fpsT >= .5) { fpsShown = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  drawDebug(fpsShown);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.PP = { render, update, drawDebug, player, cam, get W() { return W; }, get H() { return H; }, get pix() { return pix; }, BOXES, grid, matAt, setS: v => SS = v, setDebug: v => { debug = v; }, TUFTS, SPH };
})();
</script>
</body>
</html>
